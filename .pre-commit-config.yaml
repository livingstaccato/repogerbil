default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-format
        name: ruff format
        stages: [pre-commit]
      - id: ruff
        name: ruff lint
        args: [--fix, --exit-non-zero-on-fix]
        stages: [pre-commit]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        stages: [pre-commit]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  - repo: local
    hooks:
      - id: max-loc
        name: python max loc (500)
        entry: uv run python scripts/check_max_loc.py
        language: system
        pass_filenames: false
        always_run: true
        types: [python]
        stages: [pre-commit]

      - id: mypy
        name: mypy strict
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        always_run: true
        types: [python]
        stages: [pre-push]

      - id: bandit
        name: bandit security
        entry: uv run bandit -r src -ll
        language: system
        pass_filenames: false
        always_run: true
        types: [python]
        stages: [pre-push]

      - id: pytest
        name: pytest (100% coverage)
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        types: [python]
        stages: [pre-push]

      - id: xenon
        name: xenon complexity
        entry: uv run xenon --max-absolute C --max-modules B --max-average A src/
        language: system
        pass_filenames: false
        always_run: true
        types: [python]
        stages: [pre-push]

      - id: vulture
        name: vulture dead code
        entry: uv run vulture src/ tests/
        language: system
        pass_filenames: false
        always_run: true
        types: [python]
        stages: [pre-push]

      - id: mutation-gate
        name: mutmut gate (manual)
        entry: uv run mutmut run
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        types: [python]
