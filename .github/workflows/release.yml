name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    uses: provide-io/ci-tooling/workflows/python-release.yml@v0
    with:
      python-version: "3.11"
      build-backend: "uv"
      run-tests: true
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
