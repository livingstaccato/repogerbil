[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "repogerbil"
dynamic = ["version"]
description = "Git history documentation and consolidation tool"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Tim Perkins" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
repogerbil = "repogerbil.cli.main:cli"

[project.urls]
Repository = "https://github.com/livingstaccato/repogerbil"
Issues = "https://github.com/livingstaccato/repogerbil/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/repogerbil"]

# ── Ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 111
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "C90", "SIM", "PTH", "RUF", "S"]
ignore = ["ANN401", "E501", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["repogerbil", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── MyPy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
namespace_packages = true
explicit_package_bases = true

# ── Pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--color=yes",
    "--cov=repogerbil",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring git operations",
    "slow: tests taking >1s",
]
norecursedirs = [".git", "build", "dist", "*.egg-info", ".venv"]

# ── Coverage ─────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["src/repogerbil"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

# ── Mutmut ───────────────────────────────────────────────────────────────────

[tool.mutmut]
paths_to_mutate = ["src/repogerbil/"]
tests_dir = ["tests/"]
runner = "pytest"
pytest_add_cli_args = ["-o", "addopts=", "--no-cov", "-q"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "codespell>=2.4.2",
    "mutmut>=3.5.0",
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
    "vulture>=2.16",
    "xenon>=0.9.3",
]
