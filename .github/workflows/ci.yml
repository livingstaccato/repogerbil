name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # act compat: act's `docker exec` doesn't inherit the image's PATH, so
      # node (installed at /opt/acttoolcache/node/<ver>/x64/bin/node in
      # catthehacker images) is invisible to JS actions' Main/Post hooks.
      # Symlink it into /usr/local/bin (a default docker-exec PATH entry).
      # Requires sudo since the runner user (UID 1001) can't write to
      # /usr/local/bin — catthehacker images ship passwordless sudo.
      # No-op on GitHub-hosted runners (env.ACT is unset).
      - name: act compat — expose node to docker exec
        if: ${{ env.ACT }}
        run: sudo ln -sf "$(command -v node)" /usr/local/bin/node

      # Checkout source
      - uses: actions/checkout@v6

      # Install uv and the matrix Python (uv manages its own interpreters,
      # so we don't need actions/setup-python).
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: ${{ matrix.python-version }}

      # Install dependencies
      - run: uv sync --all-extras

      # Lint and format check
      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      # Type check
      - name: mypy
        run: uv run mypy src tests

      # Enforce 500-line per-file cap
      - name: max-loc
        run: make max-loc

      # Verify plugins/ matches packaged assistant_plugins/ mirror
      - name: plugin-sync
        run: make plugin-sync

      # Verify CHANGELOG.md head matches VERSION (warns on commit drift)
      - name: changelog-check
        run: make changelog-check

      # Guard against unpinned git --since=/--until= approxidate usage
      - name: approxidate-check
        run: make approxidate-check

      # Cyclomatic complexity gate
      - name: complexity
        run: make complexity

      # Dead-code scan
      - name: dead-code
        run: make dead-code

      # Security scan
      - name: bandit
        run: uv run bandit -r src -ll

      # Tests with 100% coverage
      - name: pytest
        run: uv run pytest --cov-report=xml

      # Upload coverage (skipped under act — coverage.xml is already on disk
      # locally, and act's container PATH doesn't expose node to most
      # actions/* JS bootstraps).
      - name: upload coverage
        if: ${{ matrix.python-version == '3.13' && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
